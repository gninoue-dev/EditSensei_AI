<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>EditSensei AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">編</span>
      <div>
        <div class="title">EditSensei <b>AI</b></div>
        <div class="status"><span id="dot" class="dot"></span><span id="statusText">Connexion au cerveau…</span></div>
      </div>
    </div>
    <div class="head-actions">
      <select id="styleSelect" title="Style de montage"></select>
      <button id="btnSettings" class="icon" title="Comptes IA et voix">⚙️</button>
    </div>
  </header>

  <section id="settings" class="settings" hidden>
    <div class="settings-head">
      <b>🤖 Moteur IA</b>
      <button id="btnCloseSettings" class="icon" title="Fermer">✕</button>
    </div>
    <p class="hint">Branche ton compte : c'est lui qui comprend tes demandes et pilote le montage.
      Sans IA, EditSensei comprend quand même les consignes simples.</p>
    <div id="providers"></div>
    <label class="prov local"><input type="radio" name="provider" value="local"> <span>💻 Local (sans IA)</span></label>

    <div class="settings-head"><b>🎤 Voix</b></div>
    <label class="row"><input type="checkbox" id="voiceAutoSend"> Envoyer le message dès que j'ai fini de parler</label>
    <p class="hint" id="voiceInfo"></p>
  </section>

  <main id="chat" aria-live="polite"></main>

  <div id="chips" class="chips"></div>

  <div class="toolbar">
    <button id="btnBuild" class="primary" title="Monter avec le style choisi">🎬 Monter</button>
    <button id="btnLearn" title="Apprendre le style de la vidéo sélectionnée dans le panneau Projet">📚 Apprendre</button>
    <button id="btnWatch" class="toggle" title="Mode apprenti : je regarde ta compo pendant que tu montes">👀 Apprenti</button>
    <button id="btnLike" title="Ce montage me plaît : garde-le comme exemple">👍</button>
  </div>

  <form id="form">
    <button id="mic" type="button" class="mic" title="Parler : clique, parle, je transcris (re-clique pour arrêter)">🎤</button>
    <textarea id="input" rows="2" placeholder="Ex. : fais un edit anime de 30 s en vertical, slow-mo au drop…"></textarea>
    <button id="send" type="submit" aria-label="Envoyer">➤</button>
  </form>

  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
