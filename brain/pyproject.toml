[project]
name = "editsensei-brain"
version = "2.0.0"
description = "Le cerveau d'EditSensei AI : analyse audio/vidéo, planification de montage, apprentissage de styles"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
# Optionnel : conversation enrichie par Claude (sinon EditSensei fonctionne 100 % en local)
claude = ["anthropic>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["editsensei*"]
